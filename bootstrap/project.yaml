# ArgoCD AppProject — membatasi source repo & destination cluster.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: course
  namespace: argocd
spec:
  description: "Be A DevOps Employee course project"
  # Repo yang boleh dipakai sebagai source
  sourceRepos:
    - "https://github.com/nipalzikri/adi-cicd-gitops.git"
    - "*"
  # Cluster + namespace yang boleh di-deploy
  destinations:
    - namespace: "*"
      server: "https://kubernetes.default.svc"
  # Izinkan semua resource types
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
